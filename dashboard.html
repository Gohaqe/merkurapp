<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel - Reportes Sala</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-slate-900 text-white px-6 py-5 shadow-md flex justify-between items-center rounded-b-2xl">
    <div>
      <h1 class="text-sm text-slate-400">Bienvenida,</h1>
      <h2 id="userNameDisplay" class="text-lg font-bold">Cargando...</h2>
    </div>
    <div class="flex gap-2">
      <!-- Botón Admin (Oculto por defecto) -->
      <button id="btnIrAdmin" class="bg-indigo-600 p-2 rounded-lg text-white hover:bg-indigo-500 hidden" onclick="window.location.href='admin.html'">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
      
      <button id="btnLogout" class="bg-slate-800 p-2 rounded-lg text-slate-300 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </header>

  <main class="px-4 mt-6 space-y-6 max-w-md mx-auto">
    
    <button id="btnMainTurno" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-6 rounded-2xl shadow-lg flex flex-col items-center justify-center space-y-2 transition-all active:scale-95">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span id="textoBtnTurno" class="font-bold text-lg">INICIAR NUEVO TURNO</span>
    </button>

    <div>
      <h3 class="text-sm font-bold text-slate-500 uppercase mb-3">Tus Últimos Reportes</h3>
      <div id="reportesList" class="space-y-3">
        <div class="text-center text-slate-400 text-sm py-4">Cargando historial...</div>
      </div>
    </div>

  </main>

  <!-- MODAL: DETALLE DE TURNO (TIPO REPORTE PDF) -->
  <div id="modalDetalleTurno" class="fixed inset-0 bg-slate-900/80 z-[50] flex flex-col justify-end hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-t-3xl w-full p-6 pb-8 max-h-[90vh] overflow-y-auto shadow-2xl transform translate-y-full transition-transform duration-300" id="contentDetalleTurno">
      
      <!-- Cabecera -->
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 class="text-xl font-black text-blue-900 leading-tight" id="detSalaNombre">Cargando...</h3>
          <p class="text-slate-500 text-sm font-medium mt-1" id="detFechaHora">--/--/---- • --:-- a --:--</p>
        </div>
        <button onclick="cerrarModalDetalle()" class="bg-slate-100 p-2 rounded-full text-slate-500 hover:bg-slate-200 active:scale-95 transition-transform">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Contenido de solo lectura -->
      <div class="space-y-4">
        
        <!-- DASHBOARD RÁPIDO (AFORO Y TOP 1) -->
        <div class="grid grid-cols-3 gap-3">
            <div class="col-span-1 bg-blue-50 p-3 rounded-2xl border border-blue-100 flex flex-col justify-center items-center text-center">
                <span class="text-[9px] font-bold text-blue-500 uppercase tracking-wider mb-1">Aforo</span>
                <span class="text-2xl font-black text-blue-700 leading-none" id="detAforo">--%</span>
            </div>
            <div class="col-span-2 bg-gradient-to-br from-yellow-50 to-amber-50 p-3 rounded-2xl border border-yellow-200 flex flex-col justify-center">
                <span class="text-[9px] font-bold text-yellow-600 uppercase tracking-wider mb-1">🥇 Juego Estrella</span>
                <span class="text-sm font-black text-yellow-800 leading-tight truncate" id="detTop1">Cargando...</span>
            </div>
        </div>

        <!-- TOP JUEGOS COMPLETOS -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm" id="cajaTopJuegos">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Ranking Completo</h4>
            <div id="detTopJuegosList" class="flex flex-wrap gap-1.5">
                <!-- JS inyecta etiquetas -->
            </div>
        </div>

        <!-- DETALLE DE MÁQUINAS -->
        <div id="detMaquinasContenedor" class="space-y-3">
            <!-- JS dibuja las tarjetas con horas, fallas y progresivos aquí -->
        </div>

        <!-- COMENTARIOS Y ESPIONAJE -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div>
              <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Producto</h4>
              <p id="detComProducto" class="text-sm text-slate-700 font-medium bg-slate-50 p-2 rounded-lg border border-slate-100"></p>
            </div>
            <div>
              <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Sala</h4>
              <p id="detComSala" class="text-sm text-slate-700 font-medium bg-slate-50 p-2 rounded-lg border border-slate-100"></p>
            </div>
            <div id="cajaCompetencia">
              <h4 class="text-[10px] font-bold text-orange-500 uppercase tracking-wider mb-1">Competencia 🕵️</h4>
              <p id="detComCompetencia" class="text-sm text-slate-700 font-medium bg-orange-50 p-2 rounded-lg border border-orange-100"></p>
            </div>
        </div>

        <p class="text-[10px] text-center text-slate-400 font-medium px-4 mt-2">¿Olvidaste registrar una máquina, llenar las horas o reportar una falla?</p>

        <button id="btnReabrirTurno" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 text-base flex items-center justify-center gap-2 mt-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          Reabrir Turno y Editar
        </button>
        <div class="flex gap-3 mt-4">
          <!-- Botón WhatsApp (Para Todos) -->
          <button id="btnCompartirWA" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95 text-sm flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            Compartir
          </button>

          
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
