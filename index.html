<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Reportes Sala</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    if (localStorage.getItem('usuario_id')) {
        window.location.replace('dashboard.html');
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased h-screen flex flex-col justify-center items-center p-4">

  <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 space-y-6">
    
    <!-- Logo más grande y sin texto -->
    <div class="flex justify-center mb-6 mt-1">
      <img src="icono/merkur.png" alt="Logo Merkur" class="h-41 w-auto object-contain drop-shadow-md">
    </div>

    <!-- Formulario -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Usuario</label>
        <input type="text" id="username" required class="w-full border border-slate-300 rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 transition-all">
      </div>
      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Contraseña</label>
        <input type="password" id="password" required class="w-full border border-slate-300 rounded-xl p-4 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50 transition-all">
      </div>
      <button type="submit" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-all active:scale-95">
        Ingresar
      </button>
    </form>
    
    <div id="errorMsg" class="text-red-500 text-sm text-center hidden font-medium">Credenciales incorrectas</div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
